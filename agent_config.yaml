# AFMS Configuration — agent_config.yaml
# Edit to customise folder watching, file type mappings, LLM provider, and performance.
# Restart agent_service.py after any changes.

# Full paths to folders that are never organized
protected_folders: []

# Folders to watch for automated organization (for background agent)
watch_folders:
  - C:\Users\sugho\Downloads
  - C:\Users\sugho\Documents

# Organize destination root: where organized files will be moved.
# If blank, the system defaults to the folder containing the organized files.
organize_destination_root: ""

# LLM Configuration settings
llm:
  enabled: true
  provider: local                # Options: local, openai, deepseek
  openai_model_name: "gpt-4o-mini"
  deepseek_model_name: "deepseek-chat"
  ollama_model_name: "llama3.1"
  openai_api_key: ""
  deepseek_api_key: ""
  fallback_behavior: "keyword"   # Options: keyword, unsorted

# Sorting rules config
sorting:
  hard_rules:
    - condition: "extension == '.mp4'"
      destination: "Videos"
    - condition: "name_contains: 'invoice' AND size_category == 'medium'"
      destination: "Finance/Invoices"
  content_similarity:
    enabled: true
    threshold: 0.7
    weight: 0.5
  extension_mapping:
    enabled: true
    weight: 0.2
    default_map:
      '.pdf': 'Documents/PDFs'
      '.docx': 'Documents/Word'
      '.doc': 'Documents/Word'
      '.txt': 'Documents/Text'
      '.epub': 'Documents/eBooks'
      '.mobi': 'Documents/eBooks'
      '.cbr': 'Documents/Comics'
      '.cbz': 'Documents/Comics'
      '.xlsx': 'Documents/Spreadsheets'
      '.csv': 'Documents/Spreadsheets'
      '.pptx': 'Documents/Presentations'
      '.jpg': 'Media/Images'
      '.jpeg': 'Media/Images'
      '.png': 'Media/Images'
      '.webp': 'Media/Images'
      '.bmp': 'Media/Images'
      '.gif': 'Media/Images'
      '.mp3': 'Media/Music'
      '.wav': 'Media/Music'
      '.m4a': 'Media/Music'
      '.flac': 'Media/Music'
      '.mp4': 'Media/Videos'
      '.mov': 'Media/Videos'
      '.avi': 'Media/Videos'
      '.mkv': 'Media/Videos'
      '.msi': 'Software/Installers'
      '.exe': 'Software/Executables'
      '.zip': 'Software/Archives'
      '.rar': 'Software/Archives'
      '.torrent': 'Torrents'
  size_rules:
    enabled: true
    weight: 0.1
    rules:
      - size_category: 'huge'
        destination: 'Large_Files'
  age_rules:
    enabled: true
    weight: 0.1
    rules:
      - age_category: 'old'
        destination: 'Archive/Old'
  learned_preferences:
    enabled: true
    weight: 0.3

# File extensions to monitor and process
file_types_to_process:
  - .pdf
  - .docx
  - .txt
  - .epub
  - .jpg
  - .jpeg
  - .png
  - .webp
  - .bmp
  - .gif
  - .mp3
  - .wav
  - .m4a
  - .flac
  - .mp4
  - .mov
  - .avi
  - .mkv
  - .msi
  - .torrent

# Ignore patterns (files matching these will not be processed)
ignored_patterns:
  - '*.tmp'
  - '~*'
  - '.*'
  - '~$*'
  - '*.part'
  - '*.crdownload'
  - '.DS_Store'
  - 'Thumbs.db'

# Watchdog directory monitor configuration
monitoring:
  enabled: true
  debounce_delay: 2.0  # seconds to wait before acting on modified events

# Preference learning settings
learning:
  enabled: true
  min_corrections_to_start_mining: 1
  auto_remine_interval_hours: 24
  mine_every_n_moves: 25

# Performance and resource settings
performance:
  worker_threads: 0            # 0 = auto (folder_count x2, min 4 max 8)
  stabilization_delay_ms: 500  # delay before processing on_modified events
  services_cache_enabled: true
